[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
dynamic = ["version"]
description = "A per-repo record of work for a driver agent and its leads"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools]
packages = ["ledger"]

[tool.setuptools.dynamic]
version = {attr = "ledger.__version__"}
